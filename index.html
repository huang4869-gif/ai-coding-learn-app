<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 让网页在手机上以设备宽度显示，并适配 iPhone 的刘海安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <!-- 这几行让网页“添加到主屏幕”后能像 App 一样全屏打开 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI 编程随身学" />
  <meta name="theme-color" content="#FFF6EC" />
  <title>AI 编程随身学</title>

  <!-- 全部使用系统字体，不依赖外部网络（iPhone 上中文是 PingFang，很美） -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 手机外壳：在电脑上看是居中的“手机”，在手机上则铺满屏幕 -->
  <div class="app-frame">
    <!-- 主内容区，所有页面由 js/app.js 渲染进来 -->
    <main id="app" class="screen"></main>

    <!-- 底部四个标签栏 -->
    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-tab="today" type="button">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><g class="rays"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="18.8" y1="5.2" x2="17.1" y2="6.9"/><line x1="6.9" y1="17.1" x2="5.2" y2="18.8"/></g></svg>
        <span>今日</span>
      </button>
      <button class="tab" data-tab="courses" type="button">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5V5.5Z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5V5.5Z"/></svg>
        <span>课程</span>
      </button>
      <button class="tab" data-tab="favorites" type="button">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.3C5 7.9 6.8 6 9 6c1.5 0 2.5.8 3 1.7C12.5 6.8 13.5 6 15 6c2.2 0 4 1.9 4 4.7C19 15.6 12 20 12 20Z"/></svg>
        <span>收藏</span>
      </button>
      <button class="tab" data-tab="profile" type="button">
        <svg viewBox="0 0 24 24" class="tab-ico" aria-hidden="true"><circle cx="12" cy="8.5" r="3.7"/><path d="M5 19.5c0-3.6 3.1-5.5 7-5.5s7 1.9 7 5.5"/></svg>
        <span>我的</span>
      </button>
    </nav>
  </div>

  <!-- 轻提示气泡（答错/提示等） -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- 先加载课程数据，再加载主程序 -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
